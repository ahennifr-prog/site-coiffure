# Configuration Netlify. Dans Netlify, « Base directory » doit valoir : alia-roue
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Adaptateur Next.js de Netlify, déclaré explicitement : sans lui, le site est publié
# comme des fichiers statiques et toutes les pages répondent « Page not found ».
[[plugins]]
  package = "@netlify/plugin-nextjs"
